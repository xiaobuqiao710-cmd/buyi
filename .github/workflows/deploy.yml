name: Deploy to GitHub Pages

# 只在 main 分支推送时部署；也允许手动触发（Actions 页面的 Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑；排队中的旧任务直接取消，避免发布到一半被覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 钉住 major：22 浮动到 22.x 的任意版本，Node 的 minor 偶有行为差异
          node-version: '22'
          # 本项目提交了 package-lock.json，缓存键由它生成，可安全启用。
          # 反过来，若某个仓库没有 lockfile 就必须关掉缓存（官方文档：
          # 缓存键依赖 lockfile，无 lockfile 时缓存不可复现）。
          cache: npm
          # 实际构建的是 planet/ 子项目，缓存键要指向它自己的 lockfile
          cache-dependency-path: planet/package-lock.json

      # 部署产物改为 planet/（小王子 3D 星球版）；原「纸本档案」版源码仍在仓库根目录，
      # 需要回滚时把这里换回原来的 npm run build 即可。
      - name: Build (planet)
        run: |
          cd planet
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: planet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
