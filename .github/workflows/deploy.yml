name: Deploy to GitHub Pages

# 只在 main 分支推送时部署；也允许手动触发（Actions 页面的 Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑；排队中的旧任务直接取消，避免发布到一半被覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 用 package-lock.json 精确还原依赖，比 npm install 更可复现
      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # 关键：项目站点部署在 https://<用户>.github.io/<仓库名>/，
      # 资源必须挂在这个子路径下，否则 CSS/JS 会 404（页面白屏、无样式）。
      # 这里由 GitHub 自己提供仓库名，不写死，改仓库名也不用改配置。
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
