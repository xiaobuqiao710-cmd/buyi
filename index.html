<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- favicon 走绝对路径：项目站点部署在 /<仓库名>/ 子路径下，
         相对路径在深层锚点（如 /buyi/#work）解析时会指错地方。 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fa" media="(prefers-color-scheme: light)" />
    <title>宋建豪 · 法律 × AI</title>
    <meta
      name="description"
      content="宋建豪 — 北京大学法律硕士（金融法）。法律专业能力与 AI Agent 工程能力的交叉点：自研四智能体法律检索工作流、秋招云端网申平台等。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="宋建豪 · 法律 × AI" />
    <meta
      property="og:description"
      content="北京大学法律硕士（金融法）｜法律专业能力 × AI Agent 工程实践"
    />
    <!--
      og:url / og:image / twitter:image 必须是**绝对 URL**，不能用 %BASE_URL%。
      %BASE_URL% 会被 Vite 替换成 /buyi/，那是站点根相对路径；微信、飞书、钉钉、
      微博的抓取器不解析相对路径，会去找 https://<抓取器所在域>/buyi/og.png 并 404，
      结果是分享出去只有一行灰底文字、没有任何图形。
      站点地址（用户名 xiaobuqiao710-cmd + 仓库 buyi）已确定，故直接写死；
      若将来换用户名或仓库名，这四处要同步改。
    -->
    <meta property="og:url" content="https://xiaobuqiao710-cmd.github.io/buyi/" />
    <meta property="og:image" content="https://xiaobuqiao710-cmd.github.io/buyi/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="宋建豪 · 法律 × AI 个人主页首屏" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="宋建豪 · 法律 × AI" />
    <meta
      name="twitter:description"
      content="北京大学法律硕士（金融法）｜法律专业能力 × AI Agent 工程实践"
    />
    <meta name="twitter:image" content="https://xiaobuqiao710-cmd.github.io/buyi/og.png" />

    <!-- 让首屏背景色与主题一致，避免加载瞬间白闪 -->
    <style>
      html { background: #0a0a0f; }
      @media (prefers-color-scheme: light) { html { background: #f7f7fa; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
