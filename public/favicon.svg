<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="宋建豪">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e8bff"/>
      <stop offset="1" stop-color="#b46dff"/>
    </linearGradient>
  </defs>
  <!-- 圆角方底 + 渐变，与站点主色一致；深浅两套主题下都能看清 -->
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- 首字「宋」：用系统字体渲染，避免把字形路径写死导致跨平台缺字 -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
        font-size="38" font-weight="600" fill="#ffffff">宋</text>
</svg>
